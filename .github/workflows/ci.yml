name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run 36-check verification suite
        run: node test.js
      - name: Build single-file bundle
        run: node scripts/build.js
      - uses: actions/upload-artifact@v4
        with:
          name: single-file
          path: dist/strata-pc-simulator.html
